[workspace]
resolver = "2"
members = [
    "crates/axdom-core",
    "crates/axdom-linux",
    "crates/axdom-daemon",
    "crates/axdom-mcp",
    "crates/axdom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shura5860/axdom"

[workspace.dependencies]
axdom-core = { path = "crates/axdom-core" }
axdom-linux = { path = "crates/axdom-linux" }
axdom-daemon = { path = "crates/axdom-daemon" }
axdom-mcp = { path = "crates/axdom-mcp" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
